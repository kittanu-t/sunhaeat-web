[project]
name = "sunhaeat-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.165.0",
  "pydantic==2.14.4",
  "pydantic-settings>=2.10,<3",
  "psycopg[binary,pool]==3.3.9",
  "google-genai==3.6.1",
]

[dependency-groups]
dev = ["pytest==9.2.0", "httpx==0.28.1", "ruff>=0.14", "testcontainers==4.15.0", "duckdb==2.0.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests", "../../pipeline/tests", "../../eval/tests"]
pythonpath = [".", "../.."]
addopts = "-q --import-mode=importlib"
