name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint -w apps/web
      - run: npm test -w apps/web
      - run: npm run build -w apps/web
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      # What the host installs: the app must start without dev packages.
      - run: uv run --isolated --locked --no-dev --directory apps/api python -c "import index"
      - run: uv sync --locked --project apps/api
      - run: uv run --directory apps/api ruff check ../..
      - run: uv run --directory apps/api pytest
      - run: uv export --locked --project apps/api --no-dev --no-hashes > requirements.txt && uvx pip-audit -r requirements.txt
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      # The whole history on every run; the action only scans the pushed range and fails on a first push.
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --no-banner --redact
  codeql:
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    strategy:
      matrix: { language: [javascript-typescript, python] }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with: { languages: "${{ matrix.language }}" }
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
